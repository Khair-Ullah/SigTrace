[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "siem-log-correlator"
version = "1.0.0"
description = "A lightweight, rule-based SIEM log correlation engine for Small and Medium-sized Organizations"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "SIEM Log Correlation Engine Project" }]
dependencies = [
    "Flask==3.0.0",
    "Flask-SocketIO==5.3.6",
    "Flask-Login==0.6.3",
    "SQLAlchemy==2.0.23",
    "PyYAML==6.0.1",
    "watchdog==3.0.0",
    "python-dateutil==2.8.2",
    "bcrypt==4.1.1",
    "python-dotenv==1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.3",
    "pytest-cov==4.1.0",
    "black==23.12.0",
    "ruff==0.1.8",
    "mypy==1.7.1",
    "types-PyYAML==6.0.12.12",
]
realtime = ["eventlet==0.35.1"]
desktop = [
    "pywebview>=5.0",
    "pystray>=0.19.5",
    "Pillow>=10.0",
    "waitress==3.0.0",
    "pythonnet>=3.0; sys_platform == 'win32'",
]
build = [
    "PyInstaller>=6.5",
]

[project.scripts]
siem = "siem.cli.main:cli"
siem-agent = "siem_agent.cli:main"
siem-desktop = "siem.desktop.entry:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"siem.web" = ["templates/**/*.html", "static/**/*"]
"siem.storage" = ["migrations/*.sql"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
