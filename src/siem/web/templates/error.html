{% extends "base.html" %}
{% block title %}{{ code }} · {{ app_name }}{% endblock %}
{% block content %}
<div class="max-w-lg mx-auto mt-20 text-center">
  <p class="text-6xl font-bold text-slate-700">{{ code }}</p>
  <p class="mt-4 text-slate-400">{{ message }}</p>
  <a href="{{ url_for('dashboard.index') }}"
     class="mt-6 inline-block rounded-lg bg-slate-800 px-4 py-2 text-sm text-slate-200 hover:bg-slate-700">
    Back to dashboard
  </a>
</div>
{% endblock %}
