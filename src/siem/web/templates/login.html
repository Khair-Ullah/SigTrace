<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in · {{ app_name }}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body class="h-full bg-slate-950 text-slate-200 flex items-center justify-center">
  <div class="w-full max-w-sm">
    <div class="mb-6 text-center">
      <span class="inline-block h-3 w-3 rounded-full bg-emerald-400"></span>
      <h1 class="mt-3 text-xl font-semibold tracking-tight text-slate-100">{{ app_name }}</h1>
      <p class="text-sm text-slate-500">Sign in to the dashboard</p>
    </div>

    <form method="post" action="{{ url_for('auth.login') }}"
          class="rounded-xl border border-slate-800 bg-slate-900/60 p-6 space-y-4">
      <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
      <input type="hidden" name="next" value="{{ next }}">

      {% if error %}
      <div class="rounded-lg border border-red-500/40 bg-red-500/10 px-3 py-2 text-sm text-red-300">
        {{ error }}
      </div>
      {% endif %}

      <div>
        <label class="block text-xs font-medium text-slate-400 mb-1" for="username">Username</label>
        <input id="username" name="username" autocomplete="username" required autofocus
               class="w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 text-sm
                      text-slate-100 focus:border-emerald-500 focus:outline-none focus:ring-1 focus:ring-emerald-500">
      </div>
      <div>
        <label class="block text-xs font-medium text-slate-400 mb-1" for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required
               class="w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 text-sm
                      text-slate-100 focus:border-emerald-500 focus:outline-none focus:ring-1 focus:ring-emerald-500">
      </div>
      <label class="flex items-center gap-2 text-xs text-slate-400">
        <input type="checkbox" name="remember" value="1" class="rounded border-slate-700 bg-slate-950">
        Remember me
      </label>
      <button type="submit"
              class="w-full rounded-lg bg-emerald-600 px-3 py-2 text-sm font-medium text-white
                     hover:bg-emerald-500 transition">
        Sign in
      </button>
    </form>
  </div>
</body>
</html>
